services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wallet-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_USERNAME: wallet
      DB_PASSWORD: wallet
      JWT_SECRET: change-this-to-a-long-random-secret-at-least-32-chars
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ChangeMe@123
    ports:
      - "8080:8080"

volumes:
  wallet-data:
