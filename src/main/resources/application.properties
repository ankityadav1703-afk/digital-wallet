spring.application.name=digital-wallet

# PostgreSQL (override with environment variables, see README / docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wallet}
spring.datasource.username=${DB_USERNAME:wallet}
spring.datasource.password=${DB_PASSWORD:wallet}

# Hibernate creates/updates tables automatically (use Flyway/Liquibase in a real production system)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: set JWT_SECRET to a long random string (32+ characters) in production
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-123456}
app.jwt.expiration-minutes=60

springdoc.swagger-ui.path=/swagger-ui.html

# First admin account (change these in any real deployment)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@123}
app.admin.email=${ADMIN_EMAIL:admin@wallet.local}
